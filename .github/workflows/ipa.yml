name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Xcode
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version

      - name: Build unsigned IPA
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -x
          python3 - <<'PY'
          import json, os
          c = json.load(open('build-system/appstore-configuration.json'))
          c['api_id'] = os.environ['TG_API_ID']
          c['api_hash'] = os.environ['TG_API_HASH']
          json.dump(c, open('build-system/ghostgram-ci.json', 'w'), indent=2)
          PY
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          build-system/GGXcodeConfig.sh || true
          GG_PATCHES_ONLY=1 build-system/GGBuild.sh || true
          mkdir -p build-output/ipa
          python3 -u build-system/Make/Make.py --overrideXcodeVersion \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --configurationPath build-system/ghostgram-ci.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --buildNumber=${{ github.run_number }} --configuration=release_arm64 \
            --outputBuildArtifactsPath build-output/ipa
          mv build-output/ipa/Telegram.ipa build-output/ipa/Ghostgram.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Ghostgram-ipa
          path: build-output/ipa/Ghostgram.ipa
          retention-days: 3
